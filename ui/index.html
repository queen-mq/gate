<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Gate Dashboard</title>
  <!-- Queen's favicon: the bare mark, its letter following the system theme.
       The ICO stays listed so the build embeds it for the server's /favicon.ico. -->
  <link rel="icon" type="image/svg+xml" href="/src/assets/brand/gate-favicon.svg">
  <link rel="alternate icon" type="image/png" sizes="32x32" href="/src/assets/brand/gate-favicon-32.png">
  <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/src/assets/brand/gate-favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/src/assets/brand/gate-favicon-180.png">
</head>
<body>
  <!-- The look before the first paint, as src/lib/theme.js resolves it: a stored theme and
       areas win; a first visit is soft with tone areas (light only when the previous design
       stored Light); System follows the OS. Here, as the body's first child, because the
       classes go on <body>. -->
  <script>
    (function () {
      var saved = {}
      var old = null
      try { saved = JSON.parse(localStorage.getItem('gate-look') || '{}') || {} } catch (_) {}
      try { old = localStorage.getItem('gate-theme') } catch (_) {}
      var pick = ['dark', 'soft', 'light', 'system'].indexOf(saved.theme) >= 0 ? saved.theme : (old === 'light' ? 'light' : 'soft')
      var t = pick
      if (pick === 'system') {
        t = 'dark'
        try { if (window.matchMedia('(prefers-color-scheme: light)').matches) t = 'light' } catch (_) {}
      }
      document.body.classList.add('qn', t)
      if (saved.areas !== 'lines') document.body.classList.add('tone')
      var root = document.documentElement
      root.classList.toggle('dark', t !== 'light')
      root.style.colorScheme = t === 'light' ? 'light' : 'dark'
      root.style.background = { dark: '#0d0c0b', soft: '#202020', light: '#f6f5f3' }[t]
    })()
  </script>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
