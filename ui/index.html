<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Gate</title>
  <link rel="icon" type="image/x-icon" href="/src/assets/brand/gate-favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/src/assets/brand/gate-favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/src/assets/brand/gate-favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/src/assets/brand/gate-favicon-180.png">
  <script>
    // Applied before first paint so a reload never flashes the wrong theme.
    (function () {
      var t
      try { t = localStorage.getItem('gate-theme') } catch (_) {}
      if (t !== 'light' && t !== 'dark' && t !== 'system') t = 'system'
      var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.classList.toggle('dark', dark)
      document.documentElement.dataset.theme = t
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
    })()
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
