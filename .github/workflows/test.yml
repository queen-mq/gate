name: Tests

# The suite, against a REAL broker.
#
# This job exists because the alternative was a lie: the live tests skip when no
# broker is configured, so a `cargo test` with nothing running is thirteen green
# lines that verified nothing — and the parts only they can reach are the ones the
# design rests on (a relay that is exactly-once, two replicas converging on the
# store, a throttle that is paced rather than amplified, priority at a merge,
# per-key limits across shards). So a broker is provided, and
# `GATE_TEST_REQUIRE_LIVE` turns a missing one from a skip into a failure.

# `master`, not `main`. The old trigger named a branch this repository does not
# have, so this workflow may never have run on a push at all — which is a
# particularly quiet way for a test suite to stop being a test suite.
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      queen:
        # >= 1.0.4, so the depth route's HAPPY path is exercised and not only its
        # 404 fallback — and so `kv.incr` with `max`, which is the whole limiter,
        # is the one the broker actually ships.
        image: ghcr.io/queen-mq/queen:1.0.5
        env:
          PG_HOST: postgres
          PG_PASSWORD: postgres
          # kv holds the declared specs and the cross-target budgets: without it a
          # declare cannot persist and the reconcile has nothing to reconcile against.
          QUEEN_KV_ENABLED: "true"
          # A consumer group created at the tail skips every message already waiting.
          # Gate asks for `all` explicitly on every group it owns, so this is belt to
          # that brace — and it is what the plan requires of the broker.
          DEFAULT_SUBSCRIPTION_MODE: all
        ports:
          - 6632:6632

    env:
      GATE_TEST_QUEEN_URL: http://127.0.0.1:6632
      # A missing broker is a red build here, never a skipped test.
      GATE_TEST_REQUIRE_LIVE: "1"
      # The history layer was entirely untested because nothing set this: the
      # schema, the upsert-sum and the rollup reads all short-circuit to `None`
      # without it.
      PG_HOST: 127.0.0.1
      PG_PASSWORD: postgres

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: ui/package-lock.json

    # The console is compiled into the binary by rust-embed, and a missing `ui/dist`
    # is a macro error rather than a warning — so the Rust build cannot start until
    # the console is built. That makes this a check on the console build too.
    - name: Build the console
      working-directory: ui
      run: npm ci && npm run build

    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - uses: Swatinem/rust-cache@v2

    - name: Wait for the broker
      run: |
        for i in $(seq 1 60); do
          if curl -fsS http://127.0.0.1:6632/health > /dev/null; then
            curl -fsS http://127.0.0.1:6632/health; echo; exit 0
          fi
          sleep 2
        done
        echo "queen did not become healthy" >&2
        docker ps -a >&2
        exit 1

    # `-D warnings`, so a lint is a red build rather than a line in a log
    # nobody reads.
    - name: Clippy
      run: cargo clippy --workspace --all-targets -- -D warnings

    # `--include-ignored`, because the live tests are ignored by default: a laptop
    # without a broker should report them as ignored rather than as passed, and this
    # is the job that actually runs them.
    - name: Test
      run: cargo test --workspace -- --include-ignored

    # The MSRV is declared in the workspace manifest and was never checked, so
    # nothing would have noticed a 1.87 feature until somebody on 1.86 tried to
    # build it.
    - name: MSRV
      run: |
        msrv=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
        rustup toolchain install "$msrv" --profile minimal
        cargo "+$msrv" check --workspace --all-targets

    - name: Release build
      run: cargo build --release --workspace
