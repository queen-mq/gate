[package]
name = "gate-server"
description = "gate: the target API, the gate runners, and the data plane."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
gate-core = { path = "../core" }
# The PUBLISHED client, not a path into a sibling checkout. Gate is its own
# repository: a path dependency means it only builds on a laptop that happens
# to have queen cloned next to it, and the container build cannot work at all.
queen-mq = "1.0.5"

serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
axum = "0.7"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
jsonwebtoken = "9"
getrandom = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust-embed = "8"
mime_guess = "2"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
deadpool-postgres = "0.14"
