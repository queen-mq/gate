[package]
name = "gate-bench"
description = "Measures what Gate itself costs: requests per second and latency, per use case."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# The drain half of every scenario is the application's own SDK against the
# egress queue: Gate does not mediate the pop, and a bench that went through
# Gate to read a queue would be measuring a route that no longer exists.
queen-mq = "1.0.5"
